# Builds the mod and runs every test on each push and pull request.
# The built jar is attached to the run (Actions tab -> run -> Artifacts), so a
# PR can be tried without building it yourself. Never publishes anything.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: lc_ftb_hook-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: build/reports/tests/
