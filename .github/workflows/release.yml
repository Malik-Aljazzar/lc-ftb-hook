# Publishes a version: push a tag "v<mod_version>" (e.g. v4.5.0) and this
# builds + tests the mod, then uploads the jar to CurseForge and Modrinth and
# creates a GitHub release, all with that version's CHANGELOG.md section as
# notes. Refuses to publish if the tag doesn't match mod_version in
# gradle.properties, the changelog has no section for it, or Modrinth already
# has that version (Modrinth itself would accept it a second time).
#
# Needs the repository secrets CURSEFORGE_API_KEY (CurseForge account ->
# API tokens) and MODRINTH_TOKEN (modrinth.com/settings/pats, scope "Create
# versions"). GITHUB_TOKEN is provided by GitHub itself.
#
# A version released before Modrinth was added: modrinth-backfill.yml.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match mod_version=${version} in gradle.properties"
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section"
            exit 1
          fi

      - name: Check tokens are set
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          # Without both the publish step would silently do a dry run only.
          for name in CURSEFORGE_API_KEY MODRINTH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ${name} is not set"
              exit 1
            fi
          done

      - name: Check Modrinth doesn't have this version yet
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # With the token the list includes unlisted/draft versions too.
          curl -sSf -H "Authorization: ${MODRINTH_TOKEN}" -A "Malik-Aljazzar/lc-ftb-hook release workflow" \
            "https://api.modrinth.com/v2/project/ymLKwaGY/version" > modrinth-versions.json
          if jq -e --arg v "${version}" 'map(.version_number) | index($v) != null' modrinth-versions.json > /dev/null; then
            echo "::error::Modrinth already has version ${version} - nothing was published"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and publish
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew build publishMods --console=plain
