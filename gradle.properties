org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# neo_version: what we build/run the dev environment against (kept current).
# neo_version_min: the mods.toml minimum a player needs - kept as low as our
# dependencies allow (Lightman's Currency needs 21.1.197; Numismatics needs
# 21.1.228 itself), so modpacks on older NeoForge builds (many sit on 21.1.248)
# can include us. Verified by compiling and running the migration test with
# -Pneo_version=<this value>; never raise it without that check (4.3.0 required
# 21.1.250 for no reason - CurseForge feedback, 2026-10-12).
neo_version=21.1.256
neo_version_min=21.1.197
loader_version_range=[1,)

mod_id=lc_ftb_hook
mod_name=LC FTB Hook
mod_license=All Rights Reserved
mod_version=4.4.1
mod_group_id=dev.malik.lcftbhook

# ftb_library_version: what we compile/test against (kept current).
# ftb_library_version_min: the mods.toml minimum - kept lower on purpose,
# same reasoning as neo_version_min above.
ftb_library_version=2101.1.37
ftb_library_version_min=2101.1.35
ftb_teams_version=2101.1.11
ftb_chunks_version=2101.1.22
# Compiled (and dev-tested) against the OLDEST supported LC, so the jar can't call an API that only
# newer LC versions have; newer LC (2.3.0.6) was tested separately. The minimum below is what the jar
# accepts - kept separate so bumping the build version never locks out older servers again
# (4.2.0 incident, 2026-10-09: production with LC 2.3.0.5 refused to start).
lightmanscurrency_version=1.21-2.3.0.5
lightmanscurrency_version_min=1.21-2.3.0.5
# Forced above the 13.0.8 that ftb-library/teams/chunks transitively request: 13.0.8
# has a ClassCastException bug in its custom-payload casting (ChunkChangeResponsePacket
# vs NetworkAggregator$BufCustomPacketPayload) that crashes multi-chunk claims.
architectury_version=13.0.11

# Client-only dev mods (test clients): view FTB Chunks claims on Xaero's maps.
# Xaero's mods from Modrinth; the FTB Chunks compat addon only exists on CurseForge.
xaeros_minimap_version=neoforge-1.21.1-26.6.0
xaeros_worldmap_version=neoforge-1.21.1-1.47.0
ftb_xaero_compat_project=1357724
ftb_xaero_compat_file=8103626

# OPAC (Open Parties and Claims, by xaero1996) + Numismatics (Create add-on):
# the alternative claim/currency backend this mod is gaining support for,
# alongside (not replacing) FTB Teams/Chunks + Lightman's Currency. Both
# only exist on CurseForge (no Modrinth listing at time of writing), hence
# curse.maven coordinates like ftb_xaero_compat above rather than
# maven.modrinth. compileOnly only (see build.gradle) - never bundled or
# required at runtime for players without them installed.
opac_project=636608
opac_file=9066682
numismatics_project=889722
numismatics_file=8745418

# lc_ftb_hook_xaero.mixins.json is generated from these. Xaero integration is
# optional, so the shipped default must stay soft-fail (false/0) - a real
# player whose Xaero/ftbxaerocompat updates and changes something internally
# should just silently lose the extra menu entries, not crash their game.
# Override both to true/1 on the CLI (-Pxaero_mixin_required=true
# -Pxaero_mixin_default_require=1) via scripts/Test-XaeroMixinStrict.ps1 to
# make a broken Xaero mixin target throw loudly instead, for testing after a
# Xaero/ftbxaerocompat version bump.
xaero_mixin_required=false
xaero_mixin_default_require=0
