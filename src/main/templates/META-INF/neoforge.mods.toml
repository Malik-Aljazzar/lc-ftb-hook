modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Malik Aljazzar"
description='''Paid claims, upkeep, protection regions and wars for FTB Chunks or Open Parties and Claims - paid with Lightman's Currency or Create: Numismatics. Needs one claim mod and one currency mod.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version_min},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ftblibrary"
type="optional"
versionRange="[${ftb_library_version_min},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ftbteams"
type="optional"
versionRange="[${ftb_teams_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ftbchunks"
type="optional"
versionRange="[${ftb_chunks_version},)"
ordering="NONE"
side="BOTH"

# Currency backends: at least one of Lightman's Currency / Numismatics must be
# installed (checked at startup by ModCompatibility, since mods.toml can't
# express "one of"). Each is optional here, but if present must be new enough.
[[dependencies.${mod_id}]]
modId="lightmanscurrency"
type="optional"
versionRange="[${lightmanscurrency_version_min},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="numismatics"
type="optional"
versionRange="[1.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="openpartiesandclaims"
type="optional"
versionRange="[0.31,)"
ordering="NONE"
side="BOTH"

# Lightman's Currency internals - skipped entirely (BackendMixinPlugin) when LC
# isn't installed.
[[mixins]]
config="lc_ftb_hook_lc.mixins.json"

# FTB Teams/Chunks internals - skipped entirely (BackendMixinPlugin)
# when FTB Chunks isn't installed.
[[mixins]]
config="lc_ftb_hook_ftb.mixins.json"

# Open Parties and Claims internals - the single optional hook for per-player
# chunk access lists (everything else uses OPAC's public API). Skipped
# (BackendMixinPlugin) when OPAC isn't installed.
[[mixins]]
config="lc_ftb_hook_opac.mixins.json"

# Create: Numismatics - the single optional hook letting ops open the server
# account at a Bank Terminal. Skipped (BackendMixinPlugin) when Numismatics
# isn't installed; soft-fail if its target ever changes.
[[mixins]]
config="lc_ftb_hook_numismatics.mixins.json"

# Optional (required=false in the config itself): only takes effect when
# Xaero's World Map + the FTB Chunks compat addon are both present. Safe to
# load unconditionally - Mixin skips targets that don't resolve.
[[mixins]]
config="lc_ftb_hook_xaero.mixins.json"

# Optional (required=false in the config itself): only takes effect when
# Sable Collision Damage (a Create: Aeronautics addon) is present. Safe to
# load unconditionally - Mixin skips targets that don't resolve.
[[mixins]]
config="lc_ftb_hook_sable.mixins.json"
