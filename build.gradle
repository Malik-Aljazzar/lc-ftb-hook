plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def applyDevServerConfig = tasks.register('applyDevServerConfig', Exec) {
    group = 'neoforge'
    description = 'Sets creative mode, OP, and FTB Chunks world config on the dev server'
    workingDir layout.projectDirectory.asFile
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts/Apply-DevServerConfig.ps1'
}

def applyDevClientConfig = tasks.register('applyDevClientConfig', Exec) {
    group = 'neoforge'
    description = 'Sets dev client window to bordered fullscreen (windowed, screen size)'
    workingDir layout.projectDirectory.asFile
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts/Apply-DevClientConfig.ps1'
}

def devClientWidth = findProperty('devClientWidth') ?: '1920'
def devClientHeight = findProperty('devClientHeight') ?: '1080'
def devClientWindowFile = layout.projectDirectory.file('scripts/dev/client-window.properties').asFile
if (devClientWindowFile.exists()) {
    def windowProps = new Properties()
    devClientWindowFile.withInputStream { windowProps.load(it) }
    devClientWidth = windowProps.getProperty('width', devClientWidth)
    devClientHeight = windowProps.getProperty('height', devClientHeight)
}

// Dev environments - one per claim backend x currency backend combination.
// Each has its own server directory and its own clients under clients/<env>-<n>.
// claim/currency pick the mod sets copied into the mods folders (see the copy
// tasks further down); FTB, LC, OPAC and Numismatics are never on a run's
// classpath, so each environment really only has its own two backends.
// Client usernames match that server's ops file (scripts/dev/ops*.json).
def devEnvs = [
        'ftb-lc'  : [claim: 'ftb', currency: 'lc', server: 'server', serverDir: 'run',
                     clients: [client: 'Kestrel92', client2: 'WillowDusk', client3: 'member']],
        'opac-num': [claim: 'opac', currency: 'num', server: 'serverOpac', serverDir: 'run-opac-server',
                     clients: [clientOpac1: 'OpacOwner', clientOpac2: 'OpacOfficer', clientOpac3: 'opacMember']],
        'ftb-num' : [claim: 'ftb', currency: 'num', server: 'serverFtbNum', serverDir: 'run-ftb-num-server',
                     clients: [clientFtbNum1: 'Kestrel92', clientFtbNum2: 'WillowDusk']],
        'opac-lc' : [claim: 'opac', currency: 'lc', server: 'serverOpacLc', serverDir: 'run-opac-lc-server',
                     clients: [clientOpacLc1: 'OpacOwner', clientOpacLc2: 'OpacOfficer']],
]

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        devEnvs.each { envName, env ->
            register(env.server) {
                server()
                ideName = "Server (${envName})"
                gameDirectory = project.layout.projectDirectory.dir(env.serverDir)
                // Numismatics' constructor does URI.create() on this property; MDG's
                // default is a raw Windows path ("C:\...", not a valid URI) and
                // crashes it. Same file, passed as a proper file: URI.
                systemProperty 'log4j2.configurationFile', file("build/moddev/${env.server}Log4j2.xml").toURI().toString()
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
                // owo-lib falls back to Owo.DEBUG (true in any dev run) for whether its
                // handshake is required, which then makes it skip registering the
                // "owo:handshake_off" channel that a normally-packaged (non-dev) client
                // always registers - causing "channel missing on server" disconnects.
                systemProperty 'owo.handshake.enabled', 'false'
                // Dev server config (ops, properties, ports) is applied by
                // scripts/start-server.ps1 before Gradle starts - an Exec task
                // spawning powershell.exe from Gradle can hang on Windows.
            }
            env.clients.eachWithIndex { runName, username, index ->
                register(runName) {
                    client()
                    ideName = "Client ${envName} ${index + 1}"
                    // Own directory per client: client-only mods (Sodium, Iris, ...)
                    // crash a dedicated server, so they never share a mods folder.
                    gameDirectory = project.layout.projectDirectory.dir("clients/${envName}-${index + 1}")
                    systemProperty 'log4j2.configurationFile', file("build/moddev/${runName}Log4j2.xml").toURI().toString()
                    systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
                    // "neoforge-" in MDG's own default ignoreList also matches Xaero jars like
                    // xaeros-minimap-neoforge-1.21.1-*.jar; systemProperty (not jvmArgument)
                    // replaces MDG's default instead of adding a second, ignored -D.
                    systemProperty 'ignoreList', 'mixinextras-neoforge-0.5.3.jar,client-extra,neoforge-21.'
                    programArgument '--username'
                    programArgument username
                    programArgument '--width'
                    programArgument devClientWidth
                    programArgument '--height'
                    programArgument devClientHeight
                }
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // Every backend mod is dropped into the run's mods folder (see the copy
    // tasks below) instead of the classpath: MDG's "userdev mods and services"
    // legacy-classpath locator silently skipped some of these jars, while the
    // real mods-folder locator reliably picks them up - and it keeps each dev
    // environment to exactly its own backends.
    xaeroTestMods {
        canBeConsumed = false
        canBeResolved = true
    }
    ftbTestMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    opacTestMods {
        canBeConsumed = false
        canBeResolved = true
    }
    lcTestMods {
        canBeConsumed = false
        canBeResolved = true
    }
    numismaticsTestMods {
        canBeConsumed = false
        canBeResolved = true
    }
}

repositories {
    maven {
        url = 'https://maven.ftb.dev/releases'
        content {
            includeGroup('dev.ftb.mods')
        }
    }
    maven {
        url = 'https://maven.ftb.dev/snapshots'
        content {
            includeGroup('dev.ftb.mods')
        }
    }
    maven {
        url = 'https://maven.architectury.dev'
        content {
            includeGroup('dev.architectury')
        }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup('maven.modrinth')
        }
    }
    maven {
        url = 'https://cursemaven.com'
        content {
            includeGroup('curse.maven')
        }
    }
}

dependencies {
    // Forces the resolved architectury-neoforge version above the 13.0.8 that
    // ftb-library/teams/chunks all transitively request (see gradle.properties).
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"

    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    compileOnly "dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}"
    ftbTestMods "dev.architectury:architectury-neoforge:${architectury_version}"
    ftbTestMods "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    ftbTestMods "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    ftbTestMods "dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}"

    compileOnly "maven.modrinth:lightmans-currency:${lightmanscurrency_version}"
    lcTestMods "maven.modrinth:lightmans-currency:${lightmanscurrency_version}"

    // Xaero's World Map + the FTB Chunks compat addon are an OPTIONAL
    // integration (see lc_ftb_hook_xaero.mixins.json, required=false): compileOnly
    // so the marketplace/region mixins targeting their classes can compile,
    // but never bundled or required at runtime for players without them installed.
    compileOnly "maven.modrinth:xaeros-world-map:${xaeros_worldmap_version}"
    compileOnly "curse.maven:ftb-chunks-x-xaeros-compat-${ftb_xaero_compat_project}:${ftb_xaero_compat_file}"
    // xaero.lib.* (e.g. ScreenBase, which xaero.map.gui.GuiMap extends) ships only via
    // JarJar inside xaeros-world-map's own jar (META-INF/jarjar/xaerolib-*.jar), not as
    // a normal Maven dependency Gradle can resolve - extracted once into libs/.
    compileOnly files('libs/xaerolib-neoforge-1.21.1-1.7.3.jar')

    // Client-only test mods: Xaero's Minimap + World Map, plus the FTB Chunks
    // compat addon (only copied into FTB environments).
    xaeroTestMods "maven.modrinth:xaeros-minimap:${xaeros_minimap_version}"
    xaeroTestMods "maven.modrinth:xaeros-world-map:${xaeros_worldmap_version}"
    xaeroTestMods "curse.maven:ftb-chunks-x-xaeros-compat-${ftb_xaero_compat_project}:${ftb_xaero_compat_file}"

    // OPAC (Open Parties and Claims) + Numismatics: optional backends -
    // compileOnly so their adapters compile against the real API.
    compileOnly "curse.maven:open-parties-and-claims-${opac_project}:${opac_file}"
    compileOnly "curse.maven:createnumismatics-${numismatics_project}:${numismatics_file}"

    opacTestMods "curse.maven:open-parties-and-claims-${opac_project}:${opac_file}"
    numismaticsTestMods "curse.maven:createnumismatics-${numismatics_project}:${numismatics_file}"
    // Numismatics hard-requires Create [6.0.10,6.1.0). Taken from this
    // CurseForge instance's own mods folder (the exact jar the pack ships)
    // rather than a Maven coordinate - dev-environment only.
    def packCreateJar = file("${rootDir}/../../mods/create-1.21.1-6.0.10.jar")
    if (packCreateJar.exists()) {
        numismaticsTestMods files(packCreateJar)
    }
}

// Fills every dev run's mods folder with exactly its environment's backends
// (+ Xaero for clients; the FTB Chunks Xaero addon only in FTB environments).
def backendModSets = [
        ftb : configurations.ftbTestMods,
        opac: configurations.opacTestMods,
        lc  : configurations.lcTestMods,
        num : configurations.numismaticsTestMods,
]
// A Copy task never removes the previous version of a jar it copied before, and
// NeoForge then silently loads the newest one - so a dev run could test another
// version than gradle.properties says (2026-10-09: LC 2.3.0.6 instead of 2.3.0.5).
// Before copying, drop other versions of exactly the jars being copied; every
// other mod in the folder stays.
def jarBaseName = { String fileName -> fileName.replaceFirst(/-\d.*$/, '') }
def removeStaleVersions = { Task copyTask, File modsDir ->
    if (!modsDir.directory) {
        return
    }
    def incoming = copyTask.inputs.sourceFiles.files.collect { it.name } as Set
    def incomingBases = incoming.collect { jarBaseName(it) } as Set
    modsDir.listFiles().findAll { it.name.endsWith('.jar') && !(it.name in incoming) && jarBaseName(it.name) in incomingBases }
            .each { stale ->
                logger.lifecycle("Removing stale dev mod ${stale.name} from ${modsDir}")
                stale.delete()
            }
}
devEnvs.each { envName, env ->
    def serverCopy = tasks.register("copyDevMods_${env.server}", Copy) {
        group = 'neoforge'
        description = "Drops the ${envName} backend mods into ${env.serverDir}/mods"
        from backendModSets[env.claim]
        from backendModSets[env.currency]
        into layout.projectDirectory.dir("${env.serverDir}/mods")
        doFirst { removeStaleVersions(it, file("${env.serverDir}/mods")) }
    }
    tasks.named("run${env.server.capitalize()}").configure { dependsOn(serverCopy) }
    env.clients.eachWithIndex { runName, username, index ->
        def clientDir = "clients/${envName}-${index + 1}"
        def clientCopy = tasks.register("copyDevMods_${runName}", Copy) {
            group = 'neoforge'
            description = "Drops the ${envName} backend mods + Xaero into ${clientDir}/mods"
            from backendModSets[env.claim]
            from backendModSets[env.currency]
            from(configurations.xaeroTestMods) {
                if (env.claim != 'ftb') {
                    exclude '*ftb*'
                }
            }
            into layout.projectDirectory.dir("${clientDir}/mods")
            doFirst { removeStaleVersions(it, file("${clientDir}/mods")) }
        }
        tasks.named("run${runName.capitalize()}").configure { dependsOn(clientCopy) }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_min        : neo_version_min,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            ftb_library_version    : ftb_library_version,
            ftb_library_version_min: ftb_library_version_min,
            ftb_teams_version      : ftb_teams_version,
            ftb_chunks_version     : ftb_chunks_version,
            lightmanscurrency_version: lightmanscurrency_version,
            lightmanscurrency_version_min: lightmanscurrency_version_min,
            xaero_mixin_required   : xaero_mixin_required,
            xaero_mixin_default_require: xaero_mixin_default_require
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Release notes of this version: its own section of CHANGELOG.md, from
// "## [<mod_version>]" up to the next "## [" heading. A release without one
// fails instead of going out with empty or wrong notes.
def changelogSection = providers.provider {
    def lines = file('CHANGELOG.md').readLines('UTF-8')
    int start = lines.findIndexOf { it.trim() == "## [${mod_version}]" }
    if (start < 0) {
        throw new GradleException("CHANGELOG.md has no '## [${mod_version}]' section - add one before releasing")
    }
    int end = lines.findIndexOf(start + 1) { it.startsWith('## [') }
    def body = lines.subList(start + 1, end < 0 ? lines.size() : end).join('\n').trim()
    if (body.isEmpty()) {
        throw new GradleException("The '## [${mod_version}]' section of CHANGELOG.md is empty")
    }
    // Heading included, like the notes of every upload so far.
    "## [${mod_version}]\n\n${body}"
}

// Upload to CurseForge + GitHub release, run by .github/workflows/release.yml
// on a version tag. Without CURSEFORGE_API_KEY (e.g. on a dev machine) it's
// always a dry run: the upload is only written to build/publishMods, never sent.
publishMods {
    file = jar.archiveFile
    changelog = changelogSection
    version = mod_version
    type = STABLE
    // Same names as every upload so far.
    displayName = "${mod_id}-${mod_version}"
    modLoaders.add('neoforge')
    dryRun = providers.environmentVariable('CURSEFORGE_API_KEY').getOrNull() == null

    curseforge {
        projectId = '1576403'
        accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
        minecraftVersions.add(minecraft_version)
        client = true
        server = true
        // Every backend is optional - one claim mod and one currency mod are picked at runtime.
        optional('ftb-chunks-forge', 'open-parties-and-claims', 'lightmans-currency', 'numismatics',
                'xaeros-minimap', 'xaeros-world-map')
    }
    github {
        accessToken = providers.environmentVariable('GITHUB_TOKEN')
        repository = 'Malik-Aljazzar/lc-ftb-hook'
        commitish = providers.environmentVariable('GITHUB_SHA').orElse('main')
        tagName = "v${mod_version}"
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
